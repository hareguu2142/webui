    <script>
        const table = document.querySelector('table');
        table.addEventListener('click', function(event) {
            const target = event.target;
            if (target.tagName === 'TD') {
                const column = target.cellIndex + 1;
                if (column % 2 === 0) {
                    // Even column
                    if (target.style.backgroundColor === 'blue') {
                        target.style.backgroundColor = ''; // Revert to default
                    } else {
                        target.style.backgroundColor = 'blue'; // Change to blue
                    }
                } else {
                    // Odd column
                    if (target.style.backgroundColor === 'green') {
                        target.style.backgroundColor = ''; // Revert to default
                    } else {
                        target.style.backgroundColor = 'green'; // Change to green
                    }
                }
            }
        });

        // Set background color for y=x with center (0,0)
        for (let i = 0; i < 10; i++) {
            const row = table.rows[i];
            for (let j = 0; j < 10; j++) {
                const cell = row.cells[j];
                if (i + j === 9) {
                    cell.style.backgroundColor = 'black';
                }
            }
        }
    </script>
