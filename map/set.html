<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gaegu', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-size: 18px;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: #3498db;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        h2 {
            color: #2ecc71;
            font-size: 2em;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            margin-bottom: 30px;
            border: 2px solid #eee;
            padding: 10px;
            border-radius: 10px;
        }

        .number-cell {
            background-color: #e0f7fa;
            color: #00796b;
            padding: 10px 5px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2em;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, transform 0.3s ease;
            min-height: 40px;
        }

        .number-cell.hidden {
            opacity: 0.2;
            transform: scale(0.8);
            pointer-events: none;
            background-color: #f1f1f1;
            color: #aaa;
        }

        .controls, .quiz-section .answer-area {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        input[type="number"] {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-family: 'Gaegu', cursive;
            font-size: 1em;
            width: 80px;
            text-align: center;
        }

        button {
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Gaegu', cursive;
            font-size: 1em;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        #submitAnswerButton {
            background-color: #2ecc71;
        }

        #submitAnswerButton:hover {
            background-color: #27ae60;
        }

        hr {
            border: 0;
            height: 1px;
            background: #ddd;
            margin: 30px 0;
        }

        .question {
            font-size: 1.3em;
            color: #e67e22;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .message {
            margin-top: 10px;
            font-weight: bold;
            min-height: 1.2em;
        }

        .message.success {
            color: #2ecc71;
        }

        .message.error {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1></h1>
        <div id="numberGrid" class="number-grid">
        </div>

        <div class="controls">
            <label for="filterInput"></label>
            <input type="number" id="filterInput" min="1" max="100" value="2">
            <button id="filterButton">실행</button>
            <p id="filterMessage" class="message"></p>
        </div>

        <hr>

        <div class="quiz-section">
            <h2>퀴즈!</h2>
            <p class="question">"CODE:88을 넣었을때, 남아있는 숫자들의 합은?"</p>
            <div class="answer-area">
                <label for="answerInput">정답 입력:</label>
                <input type="number" id="answerInput">
                <button id="submitAnswerButton">정답 제출</button>
            </div>
            <p id="quizResult" class="message"></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const numberGrid = document.getElementById('numberGrid');
            const filterInput = document.getElementById('filterInput');
            const filterButton = document.getElementById('filterButton');
            const filterMessage = document.getElementById('filterMessage');

            const answerInput = document.getElementById('answerInput');
            const submitAnswerButton = document.getElementById('submitAnswerButton');
            const quizResult = document.getElementById('quizResult');

            const numbers = [];

            function createGrid() {
                numberGrid.innerHTML = '';
                numbers.length = 0;
                for (let i = 1; i <= 100; i++) {
                    const cell = document.createElement('div');
                    cell.classList.add('number-cell');
                    if (i === 42) {
                        cell.textContent = 'L';
                    } else {
                        cell.textContent = i;
                    }
                    cell.dataset.value = i;
                    numberGrid.appendChild(cell);
                    numbers.push({ value: i, element: cell, visible: true });
                }
            }

            function gcd(a, b) {
                while (b) {
                    let temp = b;
                    b = a % b;
                    a = temp;
                }
                return a;
            }

            function areCoprime(num1, num2) {
                return gcd(num1, num2) === 1;
            }

            filterButton.addEventListener('click', () => {
                const inputValue = parseInt(filterInput.value);
                filterMessage.textContent = '';
                filterMessage.className = 'message';


                if (isNaN(inputValue) || inputValue < 1 || inputValue > 100) {
                    filterMessage.textContent = '';
                    filterMessage.classList.add('error');
                    return;
                }

                if (inputValue === 88) {
                    filterMessage.textContent = '';
                    filterMessage.classList.add('error');
                    return;
                }

                numbers.forEach(numObj => {
                    numObj.element.classList.remove('hidden');
                    numObj.visible = true;
                });
                
                let hiddenCount = 0;
                numbers.forEach(numObj => {
                    if (areCoprime(inputValue, numObj.value)) {
                        numObj.element.classList.add('hidden');
                        numObj.visible = false;
                        hiddenCount++;
                    }
                });
                filterMessage.textContent = '';
                filterMessage.classList.add('success');
            });

            let sumOfNumbersNotCoprimeWith88 = 0;
            for (let i = 1; i <= 100; i++) {
                if (!areCoprime(i, 88)) { 
                    sumOfNumbersNotCoprimeWith88 += i;
                }
            }

            const correctAnswer = sumOfNumbersNotCoprimeWith88; 

            submitAnswerButton.addEventListener('click', () => {
                const userAnswer = parseInt(answerInput.value);
                quizResult.className = 'message';

                if (isNaN(userAnswer)) {
                    quizResult.textContent = '숫자를 입력해주세요.';
                    quizResult.classList.add('error');
                    return;
                }

                if (userAnswer === correctAnswer) {
                    quizResult.textContent = '정답입니다! 🎉';
                    quizResult.classList.add('success');
                } else {
                    quizResult.textContent = `아닌것 같아`;
                    quizResult.classList.add('error');
                }
            });

            createGrid();
        });
    </script>
</body>
</html>
