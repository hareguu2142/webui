<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글자 색상 및 배경 예제</title>
</head>
<body>

    <!-- 1. 붉은색 글자 -->
    <p style="color: red;">이것은 붉은색 글자입니다.</p>

    <!-- 2. 초록색 형광펜 배경 -->
    <p>
        문장 중간에 
        <span style="background-color: lime;">초록색 형광펜 효과</span>
        를 적용한 예시입니다.
    </p>

</body>
</html>
