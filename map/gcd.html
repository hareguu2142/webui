<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라디오 주파수 맞추기: 2333x - 2025y = 1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>

    <!-- KaTeX CSS and JS -->
    <link href="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.css" rel="stylesheet"/>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/contrib/auto-render.min.js"></script>
    <!-- End KaTeX -->

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            padding: 20px;
            box-sizing: border-box;
        }
        #canvas-container {
            margin-bottom: 20px;
            border: 2px solid #333;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* 슬라이더 간격 증가 */
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 400px; /* 슬라이더 최대 너비 */
        }
        .slider-container label {
            min-width: 80px; /* 레이블 너비 고정 */
            font-weight: bold;
        }
        .slider-container input[type="range"] {
            flex-grow: 1;
        }
        #infoPanel {
            margin-top: 15px;
            padding: 10px;
            background-color: #e9e9e9;
            border-radius: 5px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 5px; /* 수식과의 간격 조정 */
        }
        /* p5.js가 생성하는 p 태그 스타일링 */
        .p5-text {
            font-size: 16px;
            margin: 5px 0;
        }

        /* Style for KaTeX rendered math */
        .math-equation-display {
            font-size: 1.3em; /* 수식 폰트 크기 조절 */
            color: #333;
            margin-top: 0px;
            margin-bottom: 15px; /* 캔버스와의 간격 */
            text-align: center;
        }
        /* KaTeX 에러 메시지 숨기기 (선택 사항) */
        .katex-error {
            display: none !important;
        }
    </style>
</head>
<body>
    <h1>라디오 주파수 맞추기 📻</h1>
    <!-- Modified equation display -->
    <div class="math-equation-display">$$2333x - 2025y = 1$$</div>

    <div id="canvas-container"></div>

    <div class="controls">
        <div class="slider-container">
            <label for="xSlider">X 값 (10-1000): </label>
            <input type="range" id="xSlider" min="10" max="1000" value="10">
            <span id="xValue">10</span>
        </div>
        <div class="slider-container">
            <label for="ySlider">Y 값 (10-1000): </label>
            <input type="range" id="ySlider" min="10" max="1000" value="10">
            <span id="yValue">10</span>
        </div>
    </div>

    <div id="infoPanel">
        <p id="equationResult">계산 결과: ?</p>
        <p id="statusMessage">주파수를 맞춰주세요...</p>
    </div>

    <script>
        let xSlider, ySlider;
        let xValueDisplay, yValueDisplay;
        let equationResultDisplay, statusMessageDisplay;

        let noise, sineWave;
        let successSound;
        let isSolved = false;

        const CORRECT_X = 572;
        const CORRECT_Y = 659;
        const TARGET_RESULT = 1;

        function preload() {
            soundFormats('mp3', 'ogg');
            successSound = loadSound('gcd.mp3',
                () => console.log("gcd.mp3 loaded successfully!"),
                (err) => {
                    console.error("Error loading gcd.mp3:", err);
                    alert("오디오 파일(gcd.mp3)을 로드하는데 실패했습니다. 파일이 올바른 위치에 있는지, 파일명이 정확한지 확인해주세요.");
                },
                (percentage) => console.log("gcd.mp3 loading: " + (percentage * 100).toFixed(0) + "%")
            );
        }

        function setup() {
            let canvas = createCanvas(400, 150);
            canvas.parent('canvas-container');
            background(100, 150, 200);

            xSlider = select('#xSlider');
            ySlider = select('#ySlider');
            xValueDisplay = select('#xValue');
            yValueDisplay = select('#yValue');
            equationResultDisplay = select('#equationResult');
            statusMessageDisplay = select('#statusMessage');

            xSlider.input(updateValues);
            ySlider.input(updateValues);

            noise = new p5.Noise('white');
            noise.amp(0);
            // noise.start(); // Start noise only after user interaction

            sineWave = new p5.Oscillator('sine');
            sineWave.freq(440);
            sineWave.amp(0);
            // sineWave.start(); // Start sine only after user interaction

            updateValues();
        }

        function draw() {
            if (isSolved) {
                background(150, 250, 150);
            } else {
                let valX = xSlider.value();
                let valY = ySlider.value();
                let distToSolution = abs(valX - CORRECT_X) + abs(valY - CORRECT_Y);
                let maxDist = (1000 - 10) + (1000 - 10);
                let closeness = map(distToSolution, 0, maxDist, 255, 50);
                background(closeness, 150, 200);
            }

            fill(0);
            textSize(16);
            textAlign(CENTER, CENTER);
            text(`X: ${xSlider.value()}, Y: ${ySlider.value()}`, width / 2, height / 2 - 20);

            let currentCalc = 2333 * xSlider.value() - 2025 * ySlider.value();
            text(`2333x - 2025y = ${currentCalc}`, width / 2, height / 2 + 20);

            if (isSolved) {
                fill(0, 100, 0);
                textSize(20);
                text("!", width/2, height - 30);
            }
        }

        function updateValues() {
            let currentX = parseInt(xSlider.value());
            let currentY = parseInt(ySlider.value());

            xValueDisplay.html(currentX);
            yValueDisplay.html(currentY);

            let result = 2333 * currentX - 2025 * currentY;
            equationResultDisplay.html('음..');

            // Ensure audio context is running before trying to play sounds
            if (getAudioContext().state !== 'running') {
                statusMessageDisplay.html("화면을 클릭하여 오디오를 활성화하세요.");
                statusMessageDisplay.style('color', 'blue');
                return; // Don't proceed with sound logic if audio context isn't active
            }


            if (currentX === CORRECT_X && currentY === CORRECT_Y) {
                if (result === TARGET_RESULT) {
                    if (!isSolved) {
                        isSolved = true;
                        statusMessageDisplay.html("방송이 선명하게 들린다.");
                        statusMessageDisplay.style('color', 'green');
                        statusMessageDisplay.style('font-weight', 'bold');

                        noise.amp(0, 0.5);
                        sineWave.amp(0, 0.5);

                        if (successSound.isLoaded()) {
                            if (!successSound.isPlaying()){ // 중복 재생 방지
                                successSound.loop();
                            }
                        } else {
                            console.warn("Success sound is not loaded yet.");
                        }
                    }
                } else {
                    if (isSolved) {
                         isSolved = false;
                         if (successSound.isLoaded() && successSound.isPlaying()) {
                            successSound.stop();
                        }
                    }
                    statusMessageDisplay.html(`결과값이 ${TARGET_RESULT}이 아닙니다. (현재: ${result})`);
                    statusMessageDisplay.style('color', 'orange');
                    statusMessageDisplay.style('font-weight', 'normal');

                    noise.amp(0.1, 0.5);
                    sineWave.amp(0, 0.5);
                }
            } else {
                if (isSolved) {
                    isSolved = false;
                    if (successSound.isLoaded() && successSound.isPlaying()) {
                        successSound.stop();
                    }
                }
                statusMessageDisplay.html("주파수를 맞춰주세요... (지직..)");
                statusMessageDisplay.style('color', 'red');
                statusMessageDisplay.style('font-weight', 'normal');

                let distance = abs(result - TARGET_RESULT);
                let noiseLevel = map(distance, 0, 500000, 0.05, 0.4, true);
                noise.amp(noiseLevel, 0.2);
                sineWave.amp(0, 0.5);
            }
        }

        function startAudio() {
            if (getAudioContext().state !== 'running') {
                getAudioContext().resume().then(() => {
                    console.log('AudioContext resumed.');
                    if (!noise.started) { // p5.sound property to check if started
                        noise.start();
                        noise.amp(0); // Start silent
                        console.log("Noise started");
                    }
                    if (!sineWave.oscillator) { // Check if oscillator exists (p5 way to see if it's set up)
                         sineWave.start();
                         sineWave.amp(0); // Start silent
                         console.log("SineWave started");
                    }
                    updateValues(); // Re-evaluate state after audio starts
                }).catch(e => console.error("Error resuming AudioContext:", e));
            }
        }

        function touchStarted() {
            startAudio();
            return false; // Prevent default browser behavior
        }

        function mousePressed() {
            startAudio();
        }

        // KaTeX auto-render initialization
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false}
                ],
                throwOnError: false // Prevents errors from stopping script execution
            });
        });
    </script>
</body>
</html>
