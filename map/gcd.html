<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라디오 주파수 맞추기: 2333x - 2025y = 1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>

    <!-- KaTeX CSS and JS -->
    <link href="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.css" rel="stylesheet"/>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/contrib/auto-render.min.js"></script>
    <!-- End KaTeX -->

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            padding: 20px;
            box-sizing: border-box;
        }
        #canvas-container {
            margin-bottom: 20px;
            border: 2px solid #333;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px; /* 슬라이더와 입력 그룹 간 간격 */
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px; /* 컨트롤 전체 너비 */
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .slider-container label {
            min-width: 110px; /* 레이블 너비 고정 */
            font-weight: bold;
            font-size: 0.9em;
        }
        .slider-container input[type="range"] {
            flex-grow: 1;
        }
        .slider-container span {
            min-width: 30px;
            text-align: right;
        }

        /* New styles for input fields and button */
        .input-group-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 10px; /* 슬라이더 그룹과의 간격 */
        }
        .input-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .input-container label {
            min-width: 110px; /* 슬라이더 레이블과 너비 통일 */
            font-weight: bold;
            font-size: 0.9em;
        }
        .input-container input[type="number"] {
            flex-grow: 1;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            max-width: 150px; /* 입력 필드 최대 너비 */
        }
        #submitValuesButton {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px; /* 입력 필드 그룹과의 간격 */
            width: 100%;
            max-width: 200px; /* 버튼 최대 너비 */
            align-self: center; /* 버튼 중앙 정렬 */
        }
        #submitValuesButton:hover {
            background-color: #45a049;
        }
        /* End new styles */

        #infoPanel {
            margin-top: 15px;
            padding: 10px;
            background-color: #e9e9e9;
            border-radius: 5px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
        }
        .p5-text {
            font-size: 16px;
            margin: 5px 0;
        }
        .math-equation-display {
            font-size: 1.3em;
            color: #333;
            margin-top: 0px;
            margin-bottom: 15px;
            text-align: center;
        }
        .katex-error {
            display: none !important;
        }
    </style>
</head>
<body>
    <h1>라디오 주파수 맞추기 📻</h1>
    <div class="math-equation-display">$$2333x - 2025y = 1$$</div>

    <div id="canvas-container"></div>

    <div class="controls">
        <div class="slider-container">
            <label for="xSlider">X 값 (슬라이더):</label>
            <input type="range" id="xSlider" min="10" max="1000" value="10">
            <span id="xValue">10</span>
        </div>
        <div class="slider-container">
            <label for="ySlider">Y 값 (슬라이더):</label>
            <input type="range" id="ySlider" min="10" max="1000" value="10">
            <span id="yValue">10</span>
        </div>

        <div class="input-group-container">
            <div class="input-container">
                <label for="xInput">X 직접 입력:</label>
                <input type="number" id="xInput" min="10" max="1000" value="10">
            </div>
            <div class="input-container">
                <label for="yInput">Y 직접 입력:</label>
                <input type="number" id="yInput" min="10" max="1000" value="10">
            </div>
        </div>
        <button id="submitValuesButton">입력 값 적용</button>
    </div>

    <div id="infoPanel">
        <p id="equationResult">계산 결과: ?</p>
        <p id="statusMessage">주파수를 맞춰주세요...</p>
    </div>

    <script>
        let xSlider, ySlider;
        let xValueDisplay, yValueDisplay;
        let equationResultDisplay, statusMessageDisplay;

        // New elements for direct input
        let xInput, yInput, submitButton;

        let noise, sineWave;
        let successSound;
        let isSolved = false;

        const CORRECT_X = 572;
        const CORRECT_Y = 659;
        const TARGET_RESULT = 1;

        function preload() {
            soundFormats('mp3', 'ogg');
            successSound = loadSound('gcd.mp3',
                () => console.log("gcd.mp3 loaded successfully!"),
                (err) => {
                    console.error("Error loading gcd.mp3:", err);
                    alert("오디오 파일(gcd.mp3)을 로드하는데 실패했습니다. 파일이 올바른 위치에 있는지, 파일명이 정확한지 확인해주세요.");
                },
                (percentage) => console.log("gcd.mp3 loading: " + (percentage * 100).toFixed(0) + "%")
            );
        }

        function setup() {
            let canvas = createCanvas(400, 150);
            canvas.parent('canvas-container');
            background(100, 150, 200);

            xSlider = select('#xSlider');
            ySlider = select('#ySlider');
            xValueDisplay = select('#xValue');
            yValueDisplay = select('#yValue');
            equationResultDisplay = select('#equationResult');
            statusMessageDisplay = select('#statusMessage');

            // Select new input elements
            xInput = select('#xInput');
            yInput = select('#yInput');
            submitButton = select('#submitValuesButton');

            // Initialize input field values from sliders
            xInput.value(xSlider.value());
            yInput.value(ySlider.value());

            // Event listeners
            xSlider.input(handleSliderInputChange);
            ySlider.input(handleSliderInputChange);
            submitButton.mousePressed(handleSubmitButtonClick);

            noise = new p5.Noise('white');
            noise.amp(0);

            sineWave = new p5.Oscillator('sine');
            sineWave.freq(440);
            sineWave.amp(0);

            updateValues(); // Initial update
        }

        function draw() {
            if (isSolved) {
                background(150, 250, 150);
            } else {
                let valX = parseInt(xSlider.value()); // Use parseInt for safety
                let valY = parseInt(ySlider.value());
                let distToSolution = abs(valX - CORRECT_X) + abs(valY - CORRECT_Y);
                let maxDist = (1000 - 10) + (1000 - 10); // Max possible distance
                let closeness = map(distToSolution, 0, maxDist, 255, 50); // Closer = brighter (higher first value)
                background(closeness, 150, 200);
            }

            fill(0);
            textSize(16);
            textAlign(CENTER, CENTER);
            let currentCalc = 2333 * parseInt(xSlider.value()) - 2025 * parseInt(ySlider.value());
            text(`X: ${xSlider.value()}, Y: ${ySlider.value()}`, width / 2, height / 2 - 20);
            text(`2333x - 2025y = ${currentCalc}`, width / 2, height / 2 + 20);


            if (isSolved) {
                fill(0, 100, 0);
                textSize(20);
                text("!", width/2, height - 30);
            }
        }
        
        function handleSliderInputChange() {
            // Update the corresponding number input field when a slider changes
            if (this.elt.id === 'xSlider') {
                xInput.value(this.value());
            } else if (this.elt.id === 'ySlider') {
                yInput.value(this.value());
            }
            updateValues();
        }

        function handleSubmitButtonClick() {
            let inputXVal = parseInt(xInput.value());
            let inputYVal = parseInt(yInput.value());

            // Validate and constrain input values
            inputXVal = constrain(inputXVal, 10, 1000);
            inputYVal = constrain(inputYVal, 10, 1000);
            
            // Update input fields with constrained values (in case they were out of bounds)
            xInput.value(inputXVal);
            yInput.value(inputYVal);

            // Update sliders with these new values
            xSlider.value(inputXVal);
            ySlider.value(inputYVal);

            updateValues();
        }


        function updateValues() {
            let currentX = parseInt(xSlider.value()); // Values are always read from sliders
            let currentY = parseInt(ySlider.value());

            xValueDisplay.html(currentX); // Update slider's span display
            yValueDisplay.html(currentY);

            let result = 2333 * currentX - 2025 * currentY;
            equationResultDisplay.html(`계산 결과: 2333(${currentX}) - 2025(${currentY}) = ${result}`);


            if (getAudioContext().state !== 'running') {
                statusMessageDisplay.html("화면을 클릭하여 오디오를 활성화하세요.");
                statusMessageDisplay.style('color', 'blue');
                statusMessageDisplay.style('font-weight', 'normal');
                return;
            }

            if (currentX === CORRECT_X && currentY === CORRECT_Y) {
                if (result === TARGET_RESULT) {
                    if (!isSolved) {
                        isSolved = true;
                        statusMessageDisplay.html("방송이 선명하게 들린다!");
                        statusMessageDisplay.style('color', 'green');
                        statusMessageDisplay.style('font-weight', 'bold');

                        noise.amp(0, 0.5);
                        sineWave.amp(0, 0.5);

                        if (successSound.isLoaded()) {
                            if (!successSound.isPlaying()){
                                successSound.loop();
                            }
                        } else {
                            console.warn("Success sound is not loaded yet.");
                        }
                    }
                } else { // Correct X, Y but calculation is off (should not happen with this equation)
                    if (isSolved) {
                         isSolved = false;
                         if (successSound.isLoaded() && successSound.isPlaying()) {
                            successSound.stop();
                        }
                    }
                    statusMessageDisplay.html(`X, Y는 맞지만 결과(${result})가 ${TARGET_RESULT}이(가) 아닙니다. (오류)`);
                    statusMessageDisplay.style('color', 'orange');
                    statusMessageDisplay.style('font-weight', 'normal');
                    noise.amp(0.1, 0.5);
                    sineWave.amp(0, 0.5);
                }
            } else { // X or Y (or both) are incorrect
                if (isSolved) {
                    isSolved = false;
                    if (successSound.isLoaded() && successSound.isPlaying()) {
                        successSound.stop();
                    }
                }
                statusMessageDisplay.html("주파수를 맞춰주세요... (지직..)");
                statusMessageDisplay.style('color', 'red');
                statusMessageDisplay.style('font-weight', 'normal');

                let distanceToTargetValue = abs(result - TARGET_RESULT);
                // Map distance from target value (1) to noise level
                // A large distance (e.g., 500000) should give max noise.
                // A small distance (e.g., 0 or close to 0, but not 1 yet) should give min noise.
                // We consider being off by 1 (result is 0 or 2) as still needing tuning.
                // Max possible result diff can be large: 2333*1000 - 2025*10 approx 2.3M
                // Or 2333*10 - 2025*1000 approx -2M
                let noiseLevel = map(distanceToTargetValue, 0, 1000000, 0.05, 0.4, true); // Adjusted range
                noise.amp(noiseLevel, 0.2);
                sineWave.amp(0, 0.5); // Keep sine wave off unless solved or specific condition
            }
        }

        function startAudio() {
            if (getAudioContext().state !== 'running') {
                getAudioContext().resume().then(() => {
                    console.log('AudioContext resumed.');
                    if (!noise.started) {
                        noise.start();
                        noise.amp(0);
                        console.log("Noise started");
                    }
                    if (!sineWave.oscillator) {
                         sineWave.start();
                         sineWave.amp(0);
                         console.log("SineWave started");
                    }
                    updateValues();
                }).catch(e => console.error("Error resuming AudioContext:", e));
            }
        }

        function touchStarted() {
            startAudio();
            return false;
        }

        function mousePressed() {
            // Allow clicking on canvas or other elements to start audio
            // Check if the click is on a slider, input, or button to prevent default p5 behavior if needed
            // For now, any click outside of specific interactive elements might be okay.
            // if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) { // only if click is on canvas
                 startAudio();
            // }
        }

        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false}
                ],
                throwOnError: false
            });
        });
    </script>
</body>
</html>
