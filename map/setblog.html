<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8" /> <title>Show More Set Tree</title> <style> body { font-family: sans-serif; line-height: 1.4; } .node { margin-left: 1rem; } .toggle { cursor: pointer; color: #0a58ca; background: none; border: none; padding: 0; font: inherit; text-decoration: underline; } .children { margin-left: 1.25rem; display: none; } .leaf { margin-left: 1.25rem; color: #333; } .set-name { font-weight: 600; } .bullet { margin-right: 0.25rem; color: #888; } </style> </head> <body> <h2>집합 트리 (Show More)</h2> <p>각 항목을 클릭하여 하위 집합을 펼치거나 접을 수 있습니다.</p> <div id="root"></div> <script> // 트리 정의: name과 children으로만 구성 // children이 없으면 말단(leaf)로 간주 // 문제에서 주어진 정의를 트리 구조로 재구성 const tree = { name: "S", children: [ { name: "A1", children: [ { name: "C1", children: [ "D1","D2","D3","D4","D5" ].map(n => ({ name: n })) }, { name: "C2", children: ["D6","D7"].map(n => ({ name: n })) }, { name: "C3", children: ["D8"].map(n => ({ name: n })) } ] }, { name: "A2", children: [ { name: "C4" }, { name: "C5" } ] } ] }; // 정의가 추가로 주어진 노드들: D9, D10, D11, E1, E2, E3, E4, E5 // 트리 내에서 참조될 수 있으므로 아래 매핑으로 확장 로직을 만든다. const definitions = { "D9": { name: "D9", children: [{ name: "E1" }] }, "D10": { name: "D10", children: [{ name: "E2" }, { name: "E3" }, { name: "E4" }] }, "D11": { name: "D11", children: [{ name: "E5" }, { name: "E6" }] }, "E1": { name: "E1", children: [{ name: "F1" }] }, "E2": { name: "E2", children: [{ name: "F2" }, { name: "F8" }] }, "E3": { name: "E3", children: [{ name: "F3" }] }, "E4": { name: "E4", children: [{ name: "F4" }, { name: "F5" }, { name: "F6" }] }, "E5": { name: "E5", children: [{ name: "E7" }] } // E6, E7, F1..F8은 추가 정의가 없으므로 말단 }; // 유틸: 노드가 문자열이면 객체로 변환 function normalize(node) { if (typeof node === "string") return { name: node }; return node; } // children 중 이름이 definitions에 있으면 그 정의로 확장 function expandIfDefined(node) { if (!node) return node; const defined = definitions[node.name]; if (!defined) return node; // 정의가 있으면 정의의 children을 붙인다. // 이미 children이 있는 경우는 우선 노드 자체 children을 보여주고, // 정의를 별도로 펼치고 싶다면 병합 로직을 바꿀 수 있음. // 여기서는 "정의가 있으면 그 정의를 우선"으로 함. return { name: defined.name, children: defined.children }; } function buildNode(node) { node = normalize(node); // C1.. 등처럼 children이 존재하면 그대로, 없으면 definitions를 참고 let hasChildren = Array.isArray(node.children) && node.children.length > 0; // 말단인 것 같아도 정의가 있으면 확장 if (!hasChildren && definitions[node.name]) { node = expandIfDefined(node); hasChildren = true; } const container = document.createElement("div"); container.className = "node"; if (hasChildren) { const btn = document.createElement("button"); btn.className = "toggle"; btn.textContent = node.name + " = { ... }"; btn.setAttribute("aria-expanded", "false"); const childrenBox = document.createElement("div"); childrenBox.className = "children"; node.children.forEach(child => { const childNode = buildNode(child); childrenBox.appendChild(childNode); }); btn.addEventListener("click", () => { const isOpen = childrenBox.style.display === "block"; childrenBox.style.display = isOpen ? "none" : "block"; btn.setAttribute("aria-expanded", String(!isOpen)); btn.textContent = isOpen ? node.name + " = { ... }" : node.name + " = {"; // 접힘/펼침 시 텍스트를 바꾸고 싶지 않다면 위 줄을 고치세요. }); container.appendChild(btn); container.appendChild(childrenBox); } else { const leaf = document.createElement("div"); leaf.className = "leaf"; leaf.innerHTML = '<span class="bullet">•</span>' + node.name; container.appendChild(leaf); } return container; } // 최상위 S에 D9, D10, D11도 포함하려면 여기서 추가 // 원문 정의에는 S={A1, A2}만 있지만, 문제 하위 정의 시연을 위해 // 아래 라인을 주석 해제하면 S 하위에 D9, D10, D11을 같이 배치할 수 있습니다. // tree.children.push({ name: "D9" }, { name: "D10" }, { name: "D11" }); document.getElementById("root").appendChild(buildNode(tree)); </script> </body> </html>
