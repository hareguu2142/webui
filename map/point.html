<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaction Quiz</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js"></script>
  <style>
    /* Ensure the canvas itself has a black border */
    canvas {
      border: 2px solid black;
      display: block;
      margin: 0 auto;
    }
    /* Center the controls under the canvas */
    #controls {
      text-align: center;
      margin-top: 10px;
      font-family: sans-serif;
    }
    #controls input {
      padding: 5px;
      font-size: 1rem;
      width: 100px;
      text-transform: uppercase;
    }
    #controls button {
      padding: 5px 10px;
      font-size: 1rem;
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <script>
    let centerX, centerY, radius;

    function setup() {
      // Create a square canvas (400x400)
      createCanvas(400, 400);
      // Calculate center and radius for the invisible circle
      centerX = width / 2;
      centerY = height / 2;
      radius = width / 2;
    }

    function draw() {
      let isInside = false;

      // Check mouse
      if (mouseIsPressed) {
        if (dist(mouseX, mouseY, centerX, centerY) < radius) {
          isInside = true;
        }
      }

      // Check touches (mobile)
      for (let t of touches) {
        if (dist(t.x, t.y, centerX, centerY) < radius) {
          isInside = true;
          break;
        }
      }

      // Set background color based on interaction
      if (isInside) {
        background('green');
      } else {
        background('yellow');
      }
    }
  </script>

  <!-- Controls for the quiz: hint, input box, submit button -->
  <div id="controls">
    <div>COWDE: <strong>c????e</strong></div>
  </div>
</body>
</html>
