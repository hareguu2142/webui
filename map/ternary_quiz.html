<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tri</title>
    <style>
        body {
            font-family: sans-serif;
            line-height: 1.6;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        h1, h2 {
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .rules, .examples, .quiz-question {
            margin-bottom: 20px;
        }
        .examples ul {
            list-style-type: none;
            padding-left: 0;
        }
        .examples li {
            background-color: #e9e9e9;
            margin-bottom: 5px;
            padding: 8px;
            border-radius: 4px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: calc(100% - 22px);
            margin-bottom: 10px;
        }
        input.operand-input {
            width: 120px;
            margin-bottom: 0;
            text-align: center;
        }
        input[readonly] {
            background-color: #f0f0f0;
            color: #555;
            cursor: not-allowed;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultMessage {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.2em;
            color: green;
        }
        .code {
            font-family: monospace;
            background-color: #222;
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            display: inline-block;
        }
        .operand-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .operand-row .operator {
            font-weight: bold;
            font-size: 1.2em;
        }
        .sum-area {
            background-color: #f8f8f8;
            border: 1px dashed #ccc;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>O</h1>

        <div class="examples">
            <h2>덧셈 예시</h2>
            <ul>
                <li>a + a = a</li>
                <li>a + b = b</li>
                <li>a + c = c</li>
                <li>b + b = c</li>
                <li>b + c = ba</li>
                <li>c + c = bb</li>
                <li>ba + b = bb</li>
                <li>ba + c = bc</li>
                <li>bc + b = ca</li>
                <li>bb + cc = bba</li>
            </ul>
        </div>

        <div class="quiz-question">
            <h2>문제</h2>
            <p>다음 덧셈을 계산하세요: bbbb+cccc</p>
            <div class="operand-row">
                <input type="text" id="operand1" class="operand-input" placeholder="e.g. ba">
                <span class="operator">+</span>
                <input type="text" id="operand2" class="operand-input" placeholder="e.g. ba">
            </div>
            <label for="answerInput">답:</label>
            <input type="text" id="answerInput" placeholder="예: ba">
            <button onclick="checkAnswer()">제출</button>

            <div class="sum-area">
                덧셈 결과: <span id="sumResult" class="code">...</span>
            </div>
        </div>

        <div id="resultMessage"></div>
    </div>

    <script>
        const ternaryMap = { 'a': 0, 'b': 1, 'c': 2 };
        const digitMap = ['a', 'b', 'c'];

        function fromTernary(ternaryStr) {
            let decimalValue = 0;
            let power = 0;
            for (let i = ternaryStr.length - 1; i >= 0; i--) {
                const char = ternaryStr[i];
                if (ternaryMap[char] === undefined) {
                    throw new Error("Invalid ternary character: " + char);
                }
                decimalValue += ternaryMap[char] * Math.pow(3, power);
                power++;
            }
            return decimalValue;
        }

        function toTernary(decimalValue) {
            if (decimalValue === 0) {
                return 'a';
            }
            let ternaryStr = '';
            while (decimalValue > 0) {
                const remainder = decimalValue % 3;
                ternaryStr = digitMap[remainder] + ternaryStr;
                decimalValue = Math.floor(decimalValue / 3);
            }
            return ternaryStr;
        }


        const forbiddenOperands = new Set(['bbbb', 'cccc']);

        const operand1Input = document.getElementById('operand1');
        const operand2Input = document.getElementById('operand2');
        const sumResult = document.getElementById('sumResult');
        const resultDiv = document.getElementById('resultMessage');

        const lastValidOperands = {
            operand1: '',
            operand2: ''
        };

        function normalizeOperand(value) {
            return value.trim().toLowerCase();
        }

        function isValidTernary(value) {
            return /^[abc]+$/.test(value);
        }

        function resetOutputs() {
            sumResult.textContent = '...';
            resultDiv.textContent = '';
            resultDiv.style.color = '';
        }

        function showError(message) {
            resultDiv.textContent = message;
            resultDiv.style.color = 'red';
        }

        function handleOperandInput(inputEl, key) {
            const normalized = normalizeOperand(inputEl.value);

            resetOutputs();

            if (normalized === '') {
                lastValidOperands[key] = '';
                inputEl.value = '';
                return;
            }

            if (forbiddenOperands.has(normalized)) {
                inputEl.value = lastValidOperands[key];
                showError('bbbb and cccc are not allowed.');
                return;
            }

            lastValidOperands[key] = normalized;
            inputEl.value = normalized;
        }

        operand1Input.addEventListener('input', () => handleOperandInput(operand1Input, 'operand1'));
        operand2Input.addEventListener('input', () => handleOperandInput(operand2Input, 'operand2'));

        function checkAnswer() {
            const userAnswer = normalizeOperand(document.getElementById('answerInput').value);
            const op1 = normalizeOperand(operand1Input.value);
            const op2 = normalizeOperand(operand2Input.value);

            if (!op1 || !op2) {
                showError('Enter both operands first.');
                return;
            }

            if (forbiddenOperands.has(op1) || forbiddenOperands.has(op2)) {
                showError('bbbb and cccc are not allowed.');
                return;
            }

            if (!isValidTernary(op1) || !isValidTernary(op2)) {
                showError('Only a, b, c are allowed.');
                return;
            }

            const sumDecimal = fromTernary(op1) + fromTernary(op2);
            const correctAnswer = toTernary(sumDecimal);

            sumResult.textContent = correctAnswer;

            if (userAnswer === correctAnswer) {
                resultDiv.innerHTML = '정답입니다! <br><span class="code">CODE:triangle</span>';
                resultDiv.style.color = 'green';
            } else {
                resultDiv.textContent = '오답입니다. 다시 시도해보세요.';
                resultDiv.style.color = 'red';
            }
        }
    </script>
</body>
</html>
