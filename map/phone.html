<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T9 Converter</title>
    <style>
        /* Basic CSS styling */
        body {
            font-family: sans-serif;
            padding: 20px;
            line-height: 1.6;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 20px auto;
        }
        h1 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"] {
            width: calc(100% - 22px); /* Account for padding */
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        button {
            display: block; /* Center button */
            margin: 0 auto 20px auto; /* Center button and add bottom margin */
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        #outputArea {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 4px;
            min-height: 50px;
            word-wrap: break-word; /* Ensure long numbers wrap */
            font-family: monospace; /* Good for displaying sequences */
            font-size: 1.1em;
        }
        #outputArea strong {
             display: block;
             margin-bottom: 10px;
             font-weight: bold;
             color: #333;
             font-family: sans-serif; /* Reset font for the label */
             font-size: 1em; /* Reset font size for the label */
        }
         /* Style for the code output */
        #result.code-output {
            font-family: sans-serif; /* Use standard font for the code */
            color: #dc3545; /* Red color for emphasis */
            font-weight: bold;
        }
        /* Style for the problem/hint section */
        .problem-section {
            margin-top: 30px;
            padding: 15px;
            background-color: #fffacd; /* Light yellow background */
            border: 1px dashed #ccc;
            border-radius: 5px;
        }
        .problem-section h2 {
            margin-top: 0;
            color: #8b4513; /* Brown color */
            font-size: 1.2em;
        }
         .problem-section code {
            display: block;
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;       

            word-wrap: break-word;
            margin-top: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    

    <div class="container">
        <h1>T9 숫자 변환<span style="color: red; background-color: lime;">N</span>기</h1>
<div style="display: flex; justify-content: center; align-items: center; margin-top: 20px;">
    <img src="../source/phone.png" alt="Old Phone Image" style="max-width: 50%; height: auto; border-radius: 5px; margin-right: 10px;">
    <img src="../source/phone2.png" alt="Phone Keypad Diagram" style="max-width: 50%; height: auto; border-radius: 5px; margin-left: 10px;">
</div>

        <label for="inputText">영어 문장을 입력하세요(모든 알파벳은 소문자 입니다.):</label>
        <input type="text" id="inputText" placeholder="Enter English text here...">

        <button id="convertButton">변환하기</button>

        <div id="outputArea">
            <strong>변환 결과:</strong>
            <span id="result"></span>
        </div>

        <!-- Problem Section -->
        <div class="problem-section">
            <h2>CODE</h2>
            <!-- T9: THE ESSENCE OF MATHEMATICS IS FREEDOM -->
            <code>8 44 33 0 33 7777 7777 33 66 222 33 0 666 333 0 6 2 8 44 33 6 2 8 444 222 7777 0 444 7777 0 333 777 33 33 3 666 6</code>
         </div>
        <!-- End Problem Section -->

    </div>
    

    <script>
            // T9 Mapping based on standard multi-tap
        const t9Mapping = {
          "a": { "number": "2", "presses": 1 }, "b": { "number": "2", "presses": 2 }, "c": { "number": "2", "presses": 3 },
          "d": { "number": "3", "presses": 1 }, "e": { "number": "3", "presses": 2 }, "f": { "number": "3", "presses": 3 },
          "g": { "number": "4", "presses": 1 }, "h": { "number": "4", "presses": 2 }, "i": { "number": "4", "presses": 3 },
          "j": { "number": "5", "presses": 1 }, "k": { "number": "5", "presses": 2 }, "l": { "number": "5", "presses": 3 },
          "m": { "number": "6", "presses": 1 }, "n": { "number": "6", "presses": 2 }, "o": { "number": "6", "presses": 3 },
          "p": { "number": "7", "presses": 1 }, "q": { "number": "7", "presses": 2 }, "r": { "number": "7", "presses": 3 }, "s": { "number": "7", "presses": 4 },
          "t": { "number": "8", "presses": 1 }, "u": { "number": "8", "presses": 2 }, "v": { "number": "8", "presses": 3 },
          "w": { "number": "9", "presses": 1 }, "x": { "number": "9", "presses": 2 }, "y": { "number": "9", "presses": 3 }, "z": { "number": "9", "presses": 4 }
        };

        // Get references to the HTML elements
        const inputElement = document.getElementById('inputText');
        const convertButton = document.getElementById('convertButton');
        const resultElement = document.getElementById('result');

        // ---- MODIFIED convertToT9 Function ----
        function convertToT9(text) {
            const lowerCaseText = text.toLowerCase();
            const resultSequences = [];
            // lastPushedKey는 실제로 resultSequences에 마지막으로 추가된 T9 *키*를 추적합니다.
            // (예: '2', '3', ..., '9', 또는 공백을 위한 '0').
            // 이 변수는 현재 코드 로직에서 필수는 아니지만, 더 복잡한 T9 규칙 (예: 동일 키 연속 입력 시 자동 대기)을 구현할 때 유용할 수 있습니다.
            // 현재의 단순화된 로직에서는 직접 사용되지 않아도 괜찮습니다.
            // let lastPushedKey = null; 

            for (let i = 0; i < lowerCaseText.length; i++) {
                const char = lowerCaseText[i];

                if (char === ' ') {
                    // resultSequences가 비어있지 않다면, '0'을 추가하기 전에 공백 구분자를 추가합니다.
                    if (resultSequences.length > 0) {
                        resultSequences.push(' ');
                    }
                    resultSequences.push('0');
                    // lastPushedKey = '0'; // lastPushedKey를 업데이트한다면 여기서 합니다.
                } else if (t9Mapping[char]) {
                    const mapping = t9Mapping[char];
                    const currentKey = mapping.number; // 현재 문자의 T9 키
                    const sequence = currentKey.repeat(mapping.presses); // 현재 문자의 T9 숫자 시퀀스

                    // resultSequences가 비어있지 않다면, 현재 시퀀스를 추가하기 전에 공백 구분자를 추가합니다.
                    // 이 공백은 이전 문자와 현재 문자 사이의 구분자 역할을 하며,
                    // T9 표준에서 같은 키를 연속으로 누를 때 필요한 '대기' 공백 역할도 겸합니다.
                    if (resultSequences.length > 0) {
                        resultSequences.push(' ');
                    }
                    resultSequences.push(sequence);
                    // lastPushedKey = currentKey; // lastPushedKey를 업데이트한다면 여기서 합니다.
                }
                // 매핑에 없는 문자(특수문자, 숫자 등)는 무시합니다.
            }
            // 배열의 모든 요소를 빈 문자열로 합칩니다.
            // resultSequences 배열은 이미 ['444', ' ', '0', ' ', '555', ...] 와 같이 공백을 포함하고 있습니다.
            return resultSequences.join('');
        }


        // ---- MODIFIED Event Listener ----
        convertButton.addEventListener('click', () => {
            const inputText = inputElement.value; // Get raw input
            // Perform the normal T9 conversion
            const t9Output = convertToT9(inputText);
            resultElement.textContent = t9Output; // Display the T9 result
            resultElement.className = ''; // Remove special styling if present
        });

        // Optional: Allow conversion on pressing Enter in the input field
        inputElement.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent default form submission
                convertButton.click(); // Trigger the button's click logic
            }
        });

    </script>

</body>
</html>        <!-- Add a visual aid or thematic image -->
