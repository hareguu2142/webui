<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025년 수학 퍼즐 대회</title>
    <style>
        /* Basic Reset & Font */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6; /* Light grey background */
            color: #333;
        }

        /* Centered Container */
        .container {
            max-width: 800px; /* Limit width */
            margin: 30px auto; /* Center horizontally with space top/bottom */
            padding: 25px;
            background-color: #ffffff; /* White background for content */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* Subtle shadow */
            border-radius: 8px; /* Rounded corners */
        }

        /* Headings */
        h1, h2 {
            color: #2c3e50; /* Darker blue-grey */
            border-bottom: 2px solid #e0e0e0; /* Subtle underline */
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 { font-size: 2em; }
        h2 { font-size: 1.5em; margin-top: 30px;} /* Add space above H2 */

        /* Paragraphs */
        p {
            margin-bottom: 15px;
        }

        /* Links */
        a {
            color: #3498db; /* Nice blue */
            text-decoration: none;
            transition: color 0.2s ease-in-out;
        }
        a:hover {
            color: #2980b9; /* Darker blue on hover */
            text-decoration: underline;
        }
        /* Special link styling for the submit button */
        .submit-link a {
            display: inline-block; /* Allows padding and background */
            background-color: #2ecc71; /* Green */
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s ease-in-out;
        }
        .submit-link a:hover {
            background-color: #27ae60; /* Darker green */
            text-decoration: none;
        }

        /* Map Grid */
        .map-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px; /* Space between buttons */
            margin-top: 20px;
        }

        .map-button {
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1 / 1; /* Create square shape */
            background-color: #3498db;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
            text-align: center;
            transition: background-color 0.2s ease-in-out, transform 0.2s ease;
        }

        .map-button:hover {
            background-color: #2980b9;
            transform: scale(1.05); /* Slight zoom effect on hover */
            text-decoration: none;
        }

    </style>
</head>
<body>

    <div class="container">



        <!-- 특수 CODE:TEACHER -->


        <!-- Section 1: Code Submission -->
        <section class="code-submission">
            <p class="submit-link">
                <a href="https://script.google.com/macros/s/AKfycbxXpjyImeXuSUjHr1cGizcqVLjx35PgkKbaMUhLughOYMEabUJ4O9pIIiqtt1e-Soy3qA/exec" target="_blank" rel="noopener noreferrer"></a>
            </p>
        </section>

        <!-- Section 2: Map File Links -->
        <section class="map-links">
            <div class="map-grid">
                <a href="map/phone.html" class="map-button"></a>
                <a href="map/sentence.html" class="map-button"></a>
                <a href="map/set.html" class="map-button"></a>
                <a href="map/matrix.html" class="map-button"></a>
                <a href="map/gcd.html" class="map-button"></a>
                <a href="map/point.html" class="map-button"></a>
                <a href="map/looog.html" class="map-button"></a>
                <a href="map/darkstory.html" class="map-button"></a>
                <a href="map/ternary_quiz.html" class="map-button"></a>
            </div>
        </section>

        <div style="text-align: center; margin-top: 20px;">
            <span id="toggle-hidden" style="color: rgb(243, 242, 242); cursor: pointer; font-size: 1.5em;">?</span>
        </div>

        <div id="hidden-section" style="display: none; text-align: center; margin-top: 15px;">
            <input type="text" id="secret-input" placeholder="?">
            <br>
            <img src="map/hidden.png" alt="hidden image" style="margin-top: 10px; max-width: 30%;">
        </div>

    </div> <!-- End Container -->

    <script>
        function activateNewWorld() {
            // 1. Change background and text color
            document.body.style.backgroundColor = '#000000';
            document.body.style.color = '#f4f7f6';

            // container의 배경색도 검정으로 변경
            const container = document.querySelector('.container');
            if (container) {
                container.style.backgroundColor = '#000000';
            }

            // 2. Change grid layout
            const mapGrid = document.querySelector('.map-grid');
            if (mapGrid) {
                const originalButtons = Array.from(mapGrid.querySelectorAll('.map-button'));

                // Only run if the grid is in its original 3x3 state
                if (originalButtons.length === 9) {
                    mapGrid.style.gridTemplateColumns = 'repeat(4, 1fr)';


                    const newMaps = [
                        { text: 'D', href: '#' },
                        { text: '!', href: '#' },
                        { text: 'D', href: '#' },
                        { text: 'H', href: '#' },
                        { text: 'N', href: '#' },
                        { text: 'E', href: '#' },
                        { text: 'I', href: '#' }
                    ];
                    let mapIndex = 0;

                    const createNewButton = () => {
                        const mapInfo = newMaps[mapIndex++];
                        const button = document.createElement('a');
                        button.href = mapInfo.href; // 링크는 여기서 수정
                        button.className = 'map-button';
                        button.textContent = mapInfo.text;
                        button.style.backgroundColor = '#e74c3c'; // Red color for new buttons
                        return button;
                    };

                    // Insert new buttons to create the 4x4 grid
                    originalButtons[2].after(createNewButton());
                    originalButtons[5].after(createNewButton());
                    originalButtons[8].after(createNewButton());

                    // Add the final row
                    for (let i = 0; i < 4; i++) {
                        mapGrid.appendChild(createNewButton());
                    }
                }
            }
            
            // Hide the toggle and input section
            const hiddenSection = document.getElementById('hidden-section');
            const toggleButton = document.getElementById('toggle-hidden');
            if(hiddenSection) hiddenSection.style.display = 'none';
            if(toggleButton) toggleButton.style.display = 'none';
        }

        // Check local storage on page load
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('newWorldUnlocked') === 'true') {
                activateNewWorld();
            }
        });

        // Toggle for hidden section
        document.getElementById('toggle-hidden').addEventListener('click', function() {
            var hiddenSection = document.getElementById('hidden-section');
            if (hiddenSection.style.display === 'none') {
                hiddenSection.style.display = 'block';
            } else {
                hiddenSection.style.display = 'none';
            }
        });

        // Secret code handler
        const secretInput = document.getElementById('secret-input');
        if (secretInput) {
            secretInput.addEventListener('keyup', function(event) {
                // Check for Enter key and correct value
                if (event.key === 'Enter' && this.value.toUpperCase() === 'NEWWORLD') {
                    // Activate the new world and save to local storage
                    activateNewWorld();
                    localStorage.setItem('newWorldUnlocked', 'true');
                }
            });
        }
    </script>

</body>
</html>
